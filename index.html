const WD=['日','一','二','三','四','五','六'];
const WE=['sun','mon','tue','wed','thu','fri','sat'];
const MO=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>new Date(s+'T00:00:00');
const dd=s=>{const d=pd(s);return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;};
const cd=s=>{const d=pd(s);return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${WE[d.getDay()]}）`;};
const sd=s=>{const d=pd(s);return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;};
function getRange(a,b){const s=pd(a),e=pd(b),f=s<e?s:e,t=s<e?e:s,r=[],c=new Date(f);while(c<=t){r.push(fmt(c));c.setDate(c.getDate()+1);}return r;}
function groupC(dates){if(!dates.length)return[];const s=[...dates].sort(),g=[];let c=[s[0]];for(let i=1;i<s.length;i++){if((pd(s[i])-pd(s[i-1]))/864e5===1)c.push(s[i]);else{g.push(c);c=[s[i]];}}g.push(c);return g;}
function fT(t){if(!t)return'';const[h,m]=t.split(':'),hh=+h;return`${hh===0?12:hh>12?hh-12:hh}:${m}${hh>=12?'PM':'AM'}`;}
function bCopy(ev){const g=groupC(ev.dates),l=[`📌 ${ev.name}`];if(ev.st&&ev.et)l.push(`⏰ ${fT(ev.st)} – ${fT(ev.et)} off`);else if(ev.et)l.push(`⏰ ${fT(ev.et)} off`);else if(ev.st)l.push(`⏰ ${fT(ev.st)}`);l.push('');g.forEach(x=>l.push(x.length>1?`📅${cd(x[0])} – ${cd(x[x.length-1])}`:`📅${cd(x[0])}`));l.push('',`Total : ${ev.dates.length} Days`);return l.join('\n');}
function vib(p){try{navigator.vibrate?.(p||[50,30,50]);}catch(e){}}
function gTL(ev){if(ev.st&&ev.et)return`${fT(ev.st)}–${fT(ev.et)}`;if(ev.st)return fT(ev.st);if(ev.et)return`${fT(ev.et)} off`;return'';}

function getSchedTag(dates){
  const now=new Date();now.setHours(0,0,0,0);const ts=fmt(now);
  const fut=dates.filter(d=>d>=ts).sort();
  if(!fut.length){const last=[...dates].sort().pop();if(!last)return{lb:'已過期',cls:'bg-gray-600 text-gray-200',pri:1000};const since=Math.round((now-pd(last))/864e5);return{lb:`過期${since}日`,cls:'bg-gray-600 text-gray-200',pri:1000+since};}
  if(dates.includes(ts))return{lb:'今日',cls:'bg-red-500 text-white',pu:true,pri:0};
  const diff=Math.round((pd(fut[0])-now)/864e5);
  if(diff===1)return{lb:'聽日',cls:'bg-orange-500 text-white',pri:1};
  if(diff===2)return{lb:'後日',cls:'bg-yellow-500 text-gray-900',pri:2};
  if(diff<=7)return{lb:'剩'+diff+'日',cls:'bg-blue-500/80 text-white',pri:diff};
  return{lb:'剩'+diff+'日',cls:'bg-gray-600 text-gray-200',pri:100+diff};
}
function schedPri(ev){return getSchedTag(ev.dates).pri;}

function gU(dl,dlt,urg){
  if(urg==='urgent')return{lb:'緊急',dot:'bg-red-500',bg:'bg-red-900/40 text-red-300',p:-1,pu:true};
  if(urg==='high')return{lb:'重要',dot:'bg-orange-400',bg:'bg-orange-900/30 text-orange-300',p:0.5,pu:false};
  if(urg==='low')return{lb:'唔急',dot:'bg-green-400',bg:'bg-green-900/30 text-green-300',p:8,pu:false};
  if(!dl)return{lb:'長線',dot:'bg-purple-400',bg:'bg-purple-900/40 text-purple-300',p:999,pu:false};
  const ms=new Date(dl+'T'+(dlt||'23:59')+':00')-new Date(),h=ms/36e5,d=ms/864e5;
  if(ms<0)return{lb:'過期',dot:'bg-red-500',bg:'bg-red-900/40 text-red-300',p:0,pu:true};
  if(h<6)return{lb:'幾個鐘',dot:'bg-red-400',bg:'bg-red-900/30 text-red-300',p:1,pu:true};
  if(h<24)return{lb:'今日內',dot:'bg-amber-400',bg:'bg-amber-900/30 text-amber-300',p:2,pu:false};
  if(d<2)return{lb:'聽日',dot:'bg-orange-400',bg:'bg-orange-900/30 text-orange-300',p:3,pu:false};
  if(d<4)return{lb:`${Math.ceil(d)}日內`,dot:'bg-yellow-400',bg:'bg-yellow-900/20 text-yellow-300',p:4,pu:false};
  if(d<8)return{lb:`${Math.ceil(d)}日後`,dot:'bg-purple-400',bg:'bg-purple-900/30 text-purple-300',p:5,pu:false};
  return{lb:`${Math.ceil(d)}日後`,dot:'bg-gray-400',bg:'bg-gray-800 text-gray-400',p:6,pu:false};
}
function rDL(dl,dt){if(!dl)return'';const ms=new Date(dl+'T'+(dt||'23:59')+':00')-new Date(),a=Math.abs(ms),h=Math.floor(a/36e5),d=Math.floor(a/864e5),mi=Math.floor(a/6e4);if(ms<0)return d>0?`過期${d}日`:h>0?`過期${h}小時`:`過期${mi}分鐘`;return d>0?`仲有${d}日`:h>0?`仲有${h}小時`:`仲有${mi}分鐘`;}
function fileInfo(name){const e=(name||'').split('.').pop().toLowerCase();if(e==='pdf')return{c:'bg-red-900/60 text-red-300',l:'PDF'};if(['doc','docx'].includes(e))return{c:'bg-blue-900/60 text-blue-300',l:'DOC'};if(['xls','xlsx'].includes(e))return{c:'bg-green-900/60 text-green-300',l:'XLS'};if(['ppt','pptx'].includes(e))return{c:'bg-orange-900/60 text-orange-300',l:'PPT'};return{c:'bg-gray-700 text-gray-300',l:e.toUpperCase()||'FILE'};}

let _osd=null,_osf=null;
function SwipeDel({onDel,children,bg='bg-gray-900',rcls=''}){
  const[isOp,setIsOp]=useState(false);
  const sr=useRef(null);
  const t=useRef({a:false,sx:0,sy:0,dl:false,isH:false});
  const DW=72;
  const stf=useCallback((x,an)=>{if(!sr.current)return;sr.current.style.transition=an?'transform 0.25s ease-out':'none';sr.current.style.transform=`translateX(${x}px)`;},[]);
  const cls=useCallback(()=>{setIsOp(false);stf(0,true);if(_osd===sr.current){_osd=null;_osf=null;}},[stf]);
  const opn=useCallback(()=>{setIsOp(true);stf(-DW,true);_osd=sr.current;_osf=cls;},[stf,cls]);
  useEffect(()=>()=>{if(_osd===sr.current){_osd=null;_osf=null;}},[]);
  const hTS=useCallback(e=>{if(_osd&&_osd!==sr.current)_osf?.();const tc=e.touches?.[0];if(!tc)return;t.current={a:true,sx:tc.clientX,sy:tc.clientY,dl:false,isH:false};},[]);
  const hTM=useCallback(e=>{const r=t.current;if(!r.a)return;const tc=e.touches?.[0];if(!tc)return;const dx=tc.clientX-r.sx,dy=tc.clientY-r.sy;if(!r.dl){if(Math.abs(dx)>8||Math.abs(dy)>8){r.dl=true;r.isH=Math.abs(dx)>=Math.abs(dy);}return;}if(!r.isH){r.a=false;return;}e.stopPropagation();e.preventDefault();stf(Math.min(8,Math.max(-DW-8,dx)),false);},[stf]);
  const hTE=useCallback(()=>{const r=t.current;if(!r.a)return;r.a=false;const m=sr.current?.style.transform?.match(/translateX\((.+?)px\)/);const cur=m?parseFloat(m[1]):0;if(r.dl&&r.isH){if(cur<-DW*0.35)opn();else cls();}},[opn,cls]);
  return(<div className={`relative overflow-hidden ${rcls}`}>
    <div className="absolute right-0 top-0 bottom-0 flex items-stretch" style={{width:DW}}>
      <button onClick={()=>onDel?.()} className="w-full flex items-center justify-center bg-red-500 active:bg-red-600"><Ic name="trash" className="w-5 h-5 text-white"/></button>
    </div>
    <div ref={sr} onTouchStart={hTS} onTouchMove={hTM} onTouchEnd={hTE} onTouchCancel={hTE}
      className={`relative z-10 ${bg}`} style={{willChange:'transform'}}>
      {children}
      {isOp&&<div className="absolute inset-0 z-30"
        onTouchStart={e=>{e.stopPropagation();cls();}}
        onTouchMove={e=>e.stopPropagation()}
        onTouchEnd={e=>e.stopPropagation()}
        onClick={e=>{e.stopPropagation();cls();}}/>}
    </div>
  </div>);
}

                    <h4 className="text-sm font-semibold text-blue-200">{it.title}</h4>
                    {it.content&&<p className="text-sm text-gray-300 mt-1 whitespace-pre-wrap break-words">{it.content}</p>}
                    {hasFiles&&<div className="flex gap-2 mt-2 thumb-scroll pb-1">{it.files.map(f=><Thumb key={f.id} f={f} size="w-14 h-14" onTap={fl=>fl.isImage&&setPreviewImg(fl.url)}/>)}</div>}
                  </div>}
                </div>
                <div className="flex flex-col gap-0.5 flex-shrink-0">
                  <button onClick={()=>moveItem(tp.id,it.id,-1)} disabled={ii===0} className="p-1 text-gray-500 disabled:opacity-20"><Ic name="up" className="w-3.5 h-3.5"/></button>
                  <button onClick={()=>moveItem(tp.id,it.id,1)} disabled={ii===tp.items.length-1} className="p-1 text-gray-500 disabled:opacity-20"><Ic name="down" className="w-3.5 h-3.5"/></button>
                </div>
              </div>
            </div></SwipeDel>)})}</div>}
            {!isA&&<button onClick={()=>openAI(tp.id)} className="w-full mt-3 py-2.5 rounded-xl text-sm text-blue-400 border border-dashed border-gray-700 flex items-center justify-center gap-1"><Ic name="plus" className="w-3.5 h-3.5"/>新增資訊</button>}
          </div>}
          </div></SwipeDel>);})}
      </div>
    </div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
